; PlatformIO 工程 — DUANYAN chip_info ESP32-S3
; 编译: pio run
; 烧录: esptool -p COM4 write-flash 0x0 .pio/build/esp32s3/bootloader.bin 0x8000 .pio/build/esp32s3/partitions.bin 0x10000 .pio/build/esp32s3/firmware.bin
; 或: pio run -t upload --upload-port COM4

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
monitor_speed = 115200
