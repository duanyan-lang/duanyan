[package]
name = "snarjs"
version = "0.3.0"
edition = "2021"
authors = ["Zhujun"]
description = "SNAR: The Snare Compiler - JavaScript/TypeScript to COUNPRE64"

[[bin]]
name = "snar"
path = "src/main.rs"

[lib]
name = "snarjs"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
