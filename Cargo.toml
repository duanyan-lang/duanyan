[package]
name = "hardyscript"
version = "1.5.0"
edition = "2021"
authors = ["Zhujun"]
description = "HardyScript: JavaScript/TypeScript → COUNPRE64 / ESP32 / Arduino / STM32 / 树莓派 统一硬件编程编译器"

[[bin]]
name = "hardy"
path = "src/main.rs"

[lib]
name = "hardyscript"
path = "src/lib.rs"

[dependencies]
espflash = { version = "4", features = ["serialport"] }
serialport = "4.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
