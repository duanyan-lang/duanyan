[package]
name = "snarjs"
version = "1.2.0"
edition = "2021"
authors = ["Zhujun"]
description = "SNARjs: JavaScript/TypeScript → COUNPRE64 / ESP32 / Arduino / STM32 / 树莓派 统一硬件编程编译器"

[[bin]]
name = "snar"
path = "src/main.rs"

[lib]
name = "snarjs"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
