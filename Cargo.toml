[package]
name = "duanyan"
version = "1.6.0"
edition = "2021"
authors = ["Zhujun"]
description = "DUANYAN: JavaScript/TypeScript → COUNPRE64 / ESP32 / Arduino / STM32 / 树莓派 统一硬件编程编译器"

[[bin]]
name = "duanyan"
path = "src/main.rs"

[lib]
name = "duanyan"
path = "src/lib.rs"

[dependencies]
espflash = { version = "4", features = ["serialport"] }
serialport = "4.2"

[features]
# 默认不含行业垂直域(automotive/avionics/medical/railway 等演示广度模块)
# 需要行业编译 --target ic|ad|rt|av|md|rw|se|edu|rb 时: cargo build --features domains
default = []
domains = []

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
